# Amadeus.system hyprlock theme (Steins;Gate)
# Tuned for a 1920x1200 monitor with amadeus_login_clean.png (1163x899).
#
# hyprlock scales the background to cover the screen:
#   scale = max(1920/1163, 1200/899) = 1.651, so 142px is cropped from the top and bottom.
# The image's password box (center 582,524; 250x26px) therefore lands at
# screen (961, 723), i.e. 123px below the screen center. The input-field below
# sits exactly on top of it and is slightly larger, so it hides the baked-in one.

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

background {
    monitor =
    path = ~/dotfiles/wms/hypr/amadeus_login_clean.png
    blur_passes = 0
    brightness = 1.0
    contrast = 1.0
    vibrancy = 0.0
}

# Clock: top right, barely there
label {
    monitor =
    text = cmd[update:1000] date +'%H:%M'
    color = rgba(150, 150, 150, 0.22)
    font_size = 14
    font_family = JetBrains Mono
    position = -40, -32
    halign = right
    valign = top
}

# Password field, aligned over the box in the image
input-field {
    monitor =
    size = 418, 48
    outline_thickness = 2
    rounding = 4
    dots_size = 0.3
    dots_spacing = 0.4
    dots_center = false
    fade_on_empty = false
    hide_input = false
    inner_color = rgb(4, 3, 0)
    outer_color = rgb(232, 168, 32)
    check_color = rgb(255, 210, 90)
    fail_color = rgb(200, 60, 40)
    capslock_color = rgb(255, 210, 90)
    font_color = rgb(232, 168, 32)
    font_family = JetBrains Mono
    placeholder_text =
    fail_text = <i>ACCESS DENIED</i>
    position = 0, -123
    halign = center
    valign = center
}
