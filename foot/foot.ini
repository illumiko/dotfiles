include=/home/eyanat/dotfiles/foot/dark_theme.ini
include=/home/eyanat/dotfiles/foot/light_theme.ini
[main]
# --- Shell ---
shell=zsh

# --- Font ---
# The primary font with size in points (matches kitty's font_size 14)
font=JetBrainsMono Nerd Font:size=14

# --- Window ---
# Padding around the text grid (matches kitty's window_padding_width 5)
pad=5x5

# --- Theme ---
# Include an external theme file. For the Rosé Pine theme from your kitty config,
# you can create a corresponding foot color file (see notes below) and include it here.
# include=~/.config/foot/rose-pine.ini


[cursor]
# Cursor shape (matches kitty's cursor_shape Block)
style=block
# The beam thickness is only relevant for a 'beam' cursor style.
# You can keep it for consistency, but it won't affect the block cursor.
beam-thickness=10px


[key-bindings]
# --- Reload configuration (matches kitty's map alt+r load_config_file) ---
# Note: foot does not have a built-in 'load_config_file' action.
# The closest equivalent is to spawn a new foot instance with the current config,
# or use an external script to reload. This binding is commented out because
# there is no direct action.
# map=alt+r spawn -- sh -c 'foot --server & disown'

# --- Move window actions (kitty's move_window) ---
# These actions are specific to kitty's internal window management.
# foot is a single-window terminal and delegates window management to the Wayland
# compositor. Therefore, there are no direct equivalents for these shortcuts.
# map shift+up move_window up
# map shift+left move_window left
# map shift+right move_window right
# map shift+down move_window down

# --- Move to screen edge actions (kitty's layout_action move_to_screen_edge) ---
# Similarly, these are not applicable in foot as it does not control its own
# placement on the screen. The compositor handles this.
# map ctrl+shift+up layout_action move_to_screen_edge top
# map ctrl+shift+left layout_action move_to_screen_edge left
# map ctrl+shift+right layout_action move_to_screen_edge right
# map ctrl+shift+down layout_action move_to_screen_edge bottom

# --- Switch focus to neighboring window (kitty's neighboring_window) ---
# Again, window focus management is the responsibility of the Wayland compositor,
# not the terminal emulator.
# map ctrl+left neighboring_window left
# map ctrl+right neighboring_window right
# map ctrl+up neighboring_window up
# map ctrl+down neighboring_window down
